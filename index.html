<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>禮服試穿鏡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：展場深藍牆面為底，紅白斜紋作唯一裝飾；上方鏡面舞台，下方操作列 */
:root{
  --wall:#14182a;       /* 展場深藍牆 */
  --wall-2:#1d2340;
  --line:#e9e6df;       /* 白色斜紋 */
  --red:#d8282f;        /* 紅色斜紋 */
  --cobalt:#3a4fd8;     /* 禮服鈷藍 */
  --muted:#9aa0bd;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--line);font:15px/1.6 var(--body);
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:14px;padding-top:14px}
.chev{width:44px;height:30px;flex:none}
h1{font:900 clamp(22px,4vw,30px)/1.1 var(--display);margin:0;letter-spacing:.06em;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.stage{position:relative;flex:1;min-height:58vh;display:grid;place-items:center;background:var(--wall-2);border:1px solid #2c3459;border-radius:6px;overflow:hidden}
canvas{max-width:100%;max-height:100%;display:block}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px;text-align:center;background:linear-gradient(180deg,rgba(20,24,42,.55),rgba(20,24,42,.92))}
.overlay .card{max-width:30em;max-height:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.overlay img{flex:0 1 auto;min-height:80px;max-height:34vh;width:auto;object-fit:contain;filter:drop-shadow(0 12px 24px rgba(0,0,0,.5))}
.overlay h2{font:600 20px/1.3 var(--display);margin:0;letter-spacing:.04em}
.overlay p{margin:0;color:var(--muted);font-size:14px}
.status{position:absolute;left:12px;top:12px;font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(20,24,42,.8);border:1px solid #2c3459;color:var(--muted)}
.status.ok{color:#9fe3b4;border-color:#2f6a45}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-bottom:14px}
.sliders{display:flex;flex-wrap:wrap;gap:8px 18px;flex:1;min-width:0}
label.s{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;font-size:13px;color:var(--muted);min-width:160px;flex:1}
label.s span{letter-spacing:.08em}
input[type=range]{width:100%;accent-color:var(--red)}
label.t{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border:1.5px solid var(--line);border-radius:3px;background:transparent;display:grid;place-items:center;cursor:pointer}
input[type=checkbox]:checked{background:var(--red);border-color:var(--red)}
input[type=checkbox]:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.cam{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:500 14px var(--body);padding:10px 18px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--line);cursor:pointer;letter-spacing:.06em}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
button:hover{filter:brightness(1.12)}
button:focus-visible,input:focus-visible{outline:2px solid var(--line);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
@media (max-width:640px){.controls{flex-direction:column;align-items:stretch}.btns button{flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <svg class="chev" viewBox="0 0 44 30" aria-hidden="true"><path d="M2 2 L18 15 L2 28" fill="none" stroke="#e9e6df" stroke-width="3"/><path d="M12 2 L28 15 L12 28" fill="none" stroke="#d8282f" stroke-width="3"/><path d="M22 2 L38 15 L22 28" fill="none" stroke="#e9e6df" stroke-width="3"/></svg>
  <div>
    <h1>禮服試穿鏡</h1>
    <p>開啟鏡頭，站到能拍到肩膀與腰部的位置，禮服會跟著你的身體移動</p>
  </div>
</header>

<div class="stage" id="stage">
  <canvas id="out" width="1280" height="720"></canvas>
  <div class="status" id="status" hidden>偵測中</div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h2>鈷藍織紋禮服</h2>
      <button class="primary" id="startBtn">開啟鏡頭</button>
      <p id="msg">按下「開啟鏡頭」並允許使用相機。影像只在你的裝置上處理，不會上傳。</p>
      <img id="preview" alt="試穿用的藍白織紋禮服">
    </div>
  </div>
</div>

<div class="controls">
  <div class="sliders">
    <label class="s" for="wAdj"><span>寬度</span><input id="wAdj" type="range" min="0.7" max="1.5" step="0.01" value="1"></label>
    <label class="s" for="hAdj"><span>上身長</span><input id="hAdj" type="range" min="0.7" max="1.4" step="0.01" value="1"></label>
    <label class="s" for="sAdj"><span>裙長</span><input id="sAdj" type="range" min="0.5" max="1.5" step="0.01" value="1"></label>
    <label class="s" for="yAdj"><span>上下</span><input id="yAdj" type="range" min="-0.4" max="0.4" step="0.01" value="0"></label>
  </div>
  <label class="t" for="mesh3d"><input id="mesh3d" type="checkbox" checked>立體貼合</label>
  <label class="t" for="armFront"><input id="armFront" type="checkbox" checked>手臂在禮服前</label>
  <label class="t" for="bones"><input id="bones" type="checkbox">顯示骨架點</label>
  <div class="btns">
    <button id="flipBtn" disabled>切換鏡頭</button>
    <button id="shotBtn" class="primary" disabled>拍照存檔</button>
  </div>
</div>

// 禮服圖上的錨點（像素，圖寬 720）
const A = { cx: 330, shoulderY: 60, shoulderW: 210, hipY: 330 };

const $ = id => document.getElementById(id);
const out = $("out"), ctx = out.getContext("2d");
const video = document.createElement("video");
video.playsInline = true; video.muted = true; video.autoplay = true;
video.setAttribute("playsinline",""); video.setAttribute("muted",""); video.className = "cam";
$("stage").appendChild(video);   // iOS Safari 需要 video 在頁面上才會持續更新畫面
$("preview").src = DRESS_SRC;
const dressImg = new Image();
const dress = document.createElement("canvas");   // 預先解碼好的禮服，避免 Safari 畫不出 WebP
const dressReady = new Promise((res, rej) => {
  dressImg.onload = () => {
    dress.width = dressImg.naturalWidth; dress.height = dressImg.naturalHeight;
    dress.getContext("2d").drawImage(dressImg, 0, 0);
    res();
  };
  dressImg.onerror = () => rej(new Error("dress"));
});
dressImg.src = DRESS_SRC;
let diag = "";


let landmarker = null, stream = null, facing = "user", running = false, lastTs = -1;
let smooth = null;

function setMsg(t){ $("msg").textContent = t; }

async function loadModel(){
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = d => ({
    baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", delegate:d },
    runningMode:"VIDEO", numPoses:1
  });
  try { return await PoseLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch(e){ return await PoseLandmarker.createFromOptions(fileset, opts("CPU")); }
}

async function startCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing, width:{ideal:1280}, height:{ideal:720} }, audio:false });
  video.srcObject = stream;
  await video.play();
  out.width = video.videoWidth; out.height = video.videoHeight;
}

$("startBtn").addEventListener("click", async () => {
  $("startBtn").disabled = true;
  try{
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("nocam");
    setMsg("正在載入人體偵測模型…");
    await dressReady;
    if (!gl){ try { initGL(); } catch(err){ console.error(err); gl = null; } }
    if (!gl){ $("mesh3d").checked = false; $("mesh3d").disabled = true; }
    landmarker = landmarker || await loadModel();
    setMsg("正在開啟鏡頭…");
    await startCamera();
    $("overlay").hidden = true; $("status").hidden = false;
    $("flipBtn").disabled = false; $("shotBtn").disabled = false;
    running = true; requestAnimationFrame(loop);
  }catch(e){
    console.error(e);
    $("startBtn").disabled = false;
    if (e.message === "nocam" || e.name === "NotAllowedError" || e.name === "SecurityError")
      setMsg("無法使用鏡頭。請允許相機權限，並用 Chrome、Edge 或 Safari 開啟這個檔案（或放到 https 網址上）。");
    else if (e.name === "NotFoundError") setMsg("找不到鏡頭，請確認裝置有接上攝影機。");
    else setMsg("載入失敗，請確認網路連線後再試一次。");
  }
});

$("flipBtn").addEventListener("click", async () => {
  facing = facing === "user" ? "environment" : "user";
  try{ await startCamera(); smooth = null; }catch(e){ facing = "user"; await startCamera(); }
});

$("shotBtn").addEventListener("click", () => {
  out.toBlob(b => {
    const a = document.createElement("a");
    const t = new Date(), p = n => String(n).padStart(2,"0");
    a.download = `試穿_${t.getFullYear()}${p(t.getMonth()+1)}${p(t.getDate())}_${p(t.getHours())}${p(t.getMinutes())}${p(t.getSeconds())}.png`;
    a.href = URL.createObjectURL(b); a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, "image/png");
});

const IDX = { ls:11, rs:12, le:13, re:14, lw:15, rw:16, li:19, ri:20, lh:23, rh:24, la:27, ra:28 };
function lerp(a,b,t){ return { x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t, v:b.v }; }
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function mid(a,b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2, v:Math.min(a.v,b.v) }; }

function readPose(lm){
  const W = out.width, H = out.height, p = {};
  for (const k in IDX){ const l = lm[IDX[k]]; p[k] = { x:l.x*W, y:l.y*H, v:l.visibility ?? 1 }; }
  if (!smooth) smooth = p;
  else for (const k in p){
    const s = smooth[k], n = p[k], f = 0.45;
    smooth[k] = { x:s.x+(n.x-s.x)*f, y:s.y+(n.y-s.y)*f, v:n.v };
  }
  return smooth;
}

function drawDress(p){
  const wAdj = +$("wAdj").value, hAdj = +$("hAdj").value, sAdj = +$("sAdj").value, yAdj = +$("yAdj").value;
  const sh = mid(p.ls, p.rs);
  const sw = dist(p.ls, p.rs);
  diag = `肩寬${Math.round(sw)} 畫面${out.width}×${out.height} 禮服${dress.width}×${dress.height}`;
  if (!(sw >= 20) || !dress.width) return null;
  const [a, b] = p.ls.x < p.rs.x ? [p.ls, p.rs] : [p.rs, p.ls];
  const ang = Math.atan2(b.y-a.y, b.x-a.x);
  const hipOk = p.lh.v > 0.5 && p.rh.v > 0.5;
  const torso = (hipOk ? dist(sh, mid(p.lh,p.rh)) : sw*1.3) * hAdj;
  const ankleOk = hipOk && p.la.v > 0.5 && p.ra.v > 0.5;
  const legs = (ankleOk ? dist(mid(p.lh,p.rh), mid(p.la,p.ra))*1.08 : torso*1.85) * sAdj;

  const bodyW = Math.max(sw, torso / hAdj * 0.75);   // 側身時肩寬變窄，用上身長保底
  const sx = bodyW / A.shoulderW * 1.08 * wAdj;
  const topH = A.hipY - A.shoulderY;          // 圖上肩到腰
  const skirtH = dress.height - A.hipY;       // 圖上裙長
  ctx.save();
  ctx.translate(sh.x, sh.y + yAdj*torso);
  ctx.rotate(ang);
  const sy1 = torso / topH;
  // 領口高出肩線的部分
  ctx.drawImage(dress, 0, 0, dress.width, A.hipY, -A.cx*sx, -A.shoulderY*sy1, dress.width*sx, A.hipY*sy1);
  // 裙子：從腰線往下延伸到腳踝
  ctx.drawImage(dress, 0, A.hipY-1, dress.width, skirtH+1, -A.cx*sx, torso-1, dress.width*sx, legs+1);
  ctx.restore();
  return sw;
}

// ---------- 立體貼合：WebGL 網格變形 ----------
// 上身網格綁在肩線與髖線之間；裙子綁在髖線到腳踝，裙擺有彈簧延遲與波紋。
const COLS = 18, ROWS_TOP = 12, ROWS_SKIRT = 24;
const glCv = document.createElement("canvas");
let gl = null, glU = {}, posBuf = null, meshRows = [], meshCols = [], positions = null, idxCount = 0;
const light = { r:1, g:1, b:1 }, lightCv = document.createElement("canvas");
lightCv.width = lightCv.height = 24;
const lightCtx = lightCv.getContext("2d", { willReadFrequently:true });
const phys = { P:null, V:{x:0,y:0}, t:0, phase:0 };
let frameNo = 0;

function initGL(){
  try{
    gl = glCv.getContext("webgl", { premultipliedAlpha:true, preserveDrawingBuffer:true, alpha:true, antialias:true });
  }catch(e){ gl = null; }
  if (!gl) return false;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, `
    attribute vec2 aPos; attribute vec2 aUV; attribute float aShade;
    uniform vec2 uRes; varying vec2 vUV; varying float vShade;
    void main(){ vec2 c = aPos / uRes * 2.0 - 1.0; gl_Position = vec4(c.x, -c.y, 0.0, 1.0); vUV = aUV; vShade = aShade; }`));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `
    precision mediump float; uniform sampler2D uTex; uniform vec3 uLight; varying vec2 vUV; varying float vShade;
    void main(){ vec4 t = texture2D(uTex, vUV); gl_FragColor = vec4(t.rgb * uLight * vShade, t.a); }`));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  glU.res = gl.getUniformLocation(prog, "uRes"); glU.light = gl.getUniformLocation(prog, "uLight");

  // 貼圖
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, dress);
  for (const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);

  // 網格：列 = 圖上的 y，欄 = 圖上的 x
  const DW = dress.width, DH = dress.height;
  meshRows = [];
  for (let i = 0; i <= ROWS_TOP; i++) meshRows.push(A.hipY * i / ROWS_TOP);
  for (let j = 1; j <= ROWS_SKIRT; j++) meshRows.push(A.hipY + (DH - A.hipY) * j / ROWS_SKIRT);
  meshCols = []; for (let k = 0; k <= COLS; k++) meshCols.push(DW * k / COLS);

  // 每列輪廓半寬，用來做圓筒狀的側邊陰影
  const alpha = dress.getContext("2d").getImageData(0, 0, DW, DH).data;
  const halfW = meshRows.map(y => {
    const yy = Math.min(DH-1, Math.round(y)); let m = 20;
    for (let x = 0; x < DW; x++) if (alpha[(yy*DW + x)*4 + 3] > 128) m = Math.max(m, Math.abs(x - A.cx));
    return m;
  });
  const nV = meshRows.length * meshCols.length;
  const uv = new Float32Array(nV*2), shade = new Float32Array(nV);
  let v = 0;
  meshRows.forEach((y, r) => meshCols.forEach(x => {
    uv[v*2] = x / DW; uv[v*2+1] = y / DH;
    const e = Math.min(1, Math.max(0, (Math.abs(x - A.cx) / halfW[r] - 0.45) / 0.55));
    shade[v] = 1 - 0.26 * e * e * (3 - 2*e);
    v++;
  }));
  const idx = [];
  const C = meshCols.length;
  for (let r = 0; r < meshRows.length - 1; r++) for (let c = 0; c < C - 1; c++){
    const a = r*C + c, b = a + 1, d = a + C, e2 = d + 1;
    idx.push(a, d, b, b, d, e2);
  }
  idxCount = idx.length;
  const buf = (data, loc, size) => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    const l = gl.getAttribLocation(prog, loc); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, size, gl.FLOAT, false, 0, 0); return b; };
  buf(uv, "aUV", 2); buf(shade, "aShade", 1);
  positions = new Float32Array(nV*2);
  posBuf = buf(positions, "aPos", 2);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  return true;
}

// 依鏡頭畫面的亮度與色溫，調整禮服顏色
function sampleLight(){
  lightCtx.drawImage(video, 0, 0, 24, 24);
  const d = lightCtx.getImageData(4, 4, 16, 16).data;
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < d.length; i += 4){ r += d[i]; g += d[i+1]; b += d[i+2]; }
  const n = d.length / 4; r /= n*255; g /= n*255; b /= n*255;
  const lum = 0.299*r + 0.587*g + 0.114*b, avg = (r+g+b)/3 || 1;
  const gain = 1 + (Math.min(1.2, Math.max(0.6, lum / 0.38)) - 1) * 0.7;
  const tint = c => gain * (1 + (c/avg - 1) * 0.22);
  const f = 0.15;
  light.r += (tint(r) - light.r) * f; light.g += (tint(g) - light.g) * f; light.b += (tint(b) - light.b) * f;
}

const V2 = {
  add:(a,b)=>({x:a.x+b.x,y:a.y+b.y}), sub:(a,b)=>({x:a.x-b.x,y:a.y-b.y}), mul:(a,k)=>({x:a.x*k,y:a.y*k}),
  len:a=>Math.hypot(a.x,a.y), unit:a=>{ const l = Math.hypot(a.x,a.y) || 1; return {x:a.x/l, y:a.y/l}; },
  dot:(a,b)=>a.x*b.x+a.y*b.y, perp:a=>({x:-a.y, y:a.x}), lerp:(a,b,t)=>({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t})
};

function drawDressMesh(p, now){
  const wAdj = +$("wAdj").value, hAdj = +$("hAdj").value, sAdj = +$("sAdj").value, yAdj = +$("yAdj").value;
  if (glCv.width !== out.width || glCv.height !== out.height){ glCv.width = out.width; glCv.height = out.height; }
  let sh = mid(p.ls, p.rs);
  let S = V2.mul(V2.sub(p.rs, p.ls), 0.5);
  const sLen = V2.len(S);
  const hipOk = p.lh.v > 0.5 && p.rh.v > 0.5;
  let hip, Hv;
  if (hipOk){ hip = mid(p.lh, p.rh); Hv = V2.mul(V2.sub(p.rh, p.lh), 0.5); }
  else {
    let d = V2.unit(V2.perp(S)); if (d.y < 0) d = V2.mul(d, -1);
    hip = V2.add(sh, V2.mul(d, sLen * 2.6)); Hv = V2.mul(S, 0.72);
  }
  const torsoDir = V2.unit(V2.sub(hip, sh));
  const torsoLen = V2.len(V2.sub(hip, sh)) * hAdj;
  diag = `肩寬${Math.round(sLen*2)} 上身${Math.round(torsoLen)} 畫面${out.width}×${out.height}`;
  if (!(torsoLen > 30)) return null;
  const shift = V2.mul(torsoDir, yAdj * torsoLen);
  sh = V2.add(sh, shift);
  hip = V2.add(sh, V2.mul(torsoDir, torsoLen));

  const wf = 1.08 * wAdj;
  const frontal = torsoLen * 0.33;                       // 正面時的半肩寬估計
  let sDir = sLen > 1 ? V2.unit(S) : V2.unit(V2.perp(torsoDir));
  if (V2.dot(V2.perp(sDir), torsoDir) < 0) {}            // 方向保持與左右肩一致
  const Seff = V2.mul(sDir, Math.max(sLen, frontal * 0.6) * wf);   // 側身會變窄，但不會變成細線
  let hDir = V2.len(Hv) > 1 ? V2.unit(Hv) : sDir;
  if (V2.dot(hDir, sDir) < 0) hDir = V2.mul(hDir, -1);
  const Heff = V2.mul(hDir, Math.max(V2.len(Hv) / 0.72, frontal * 0.6) * wf);

  // 裙子軸線
  const ankleOk = hipOk && p.la.v > 0.5 && p.ra.v > 0.5;
  let sk, skLen;
  if (ankleOk){ const an = mid(p.la, p.ra); sk = V2.unit(V2.sub(an, hip)); skLen = V2.len(V2.sub(an, hip)) * 1.08 * sAdj; }
  else { sk = torsoDir; skLen = torsoLen * 1.85 * sAdj; }
  let hemPerp = V2.unit(V2.perp(sk)); if (V2.dot(hemPerp, hDir) < 0) hemPerp = V2.mul(hemPerp, -1);
  const hemB = V2.mul(hemPerp, Math.max(sLen, frontal * 0.85) * wf);   // 鐘形裙側身時幾乎不變窄

  // 裙擺物理：彈簧跟隨髖部，產生延遲擺動
  const dt = phys.t ? Math.min(0.05, Math.max(0, (now - phys.t) / 1000)) : 0;
  phys.t = now;
  if (!phys.P){ phys.P = { x:hip.x, y:hip.y }; phys.V = { x:0, y:0 }; }
  const k = 40, c = 8;
  const acc = V2.sub(V2.mul(V2.sub(hip, phys.P), k), V2.mul(phys.V, c));
  phys.V = V2.add(phys.V, V2.mul(acc, dt));
  phys.P = V2.add(phys.P, V2.mul(phys.V, dt));
  let lag = V2.sub(phys.P, hip);
  const maxLag = torsoLen * 0.35;
  if (V2.len(lag) > maxLag){ lag = V2.mul(V2.unit(lag), maxLag); phys.P = V2.add(hip, lag); }
  const speed = V2.len(phys.V);
  phys.phase += dt * (4 + Math.min(6, speed / Math.max(40, torsoLen) * 3));
  const amp = Math.min(speed * 0.02, torsoLen * 0.05) + torsoLen * 0.006;

  const half = A.shoulderW / 2, DH = dress.height;
  let v = 0;
  for (const y of meshRows){
    let center, basis, q = 0;
    if (y <= A.hipY){
      const t = (y - A.shoulderY) / (A.hipY - A.shoulderY);
      center = V2.lerp(sh, hip, t);
      basis = V2.lerp(Seff, Heff, Math.min(1, Math.max(0, t)));
    } else {
      q = (y - A.hipY) / (DH - A.hipY);
      center = V2.add(V2.add(hip, V2.mul(sk, skLen * q)), V2.mul(lag, Math.pow(q, 1.6)));
      basis = V2.lerp(Heff, hemB, Math.pow(q, 0.7));
    }
    for (const x of meshCols){
      const s = (x - A.cx) / half;
      let P = V2.add(center, V2.mul(basis, s));
      if (q > 0){
        const w = Math.sin(phys.phase + s * 1.7 + q * 2.4) * amp * q * q;
        P = V2.add(P, V2.mul(hemPerp, w));
        P = V2.add(P, V2.mul(sk, Math.cos(phys.phase * 1.3 + s * 2.1) * amp * 0.35 * q * q));
      }
      positions[v++] = P.x; positions[v++] = P.y;
    }
  }

  if (frameNo++ % 8 === 0) sampleLight();
  gl.viewport(0, 0, glCv.width, glCv.height);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(glU.res, glCv.width, glCv.height);
  gl.uniform3f(glU.light, light.r, light.g, light.b);
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);
  gl.drawElements(gl.TRIANGLES, idxCount, gl.UNSIGNED_SHORT, 0);
  ctx.drawImage(glCv, 0, 0);
  return V2.len(Seff) * 2 / wf;
}

// 用「膠囊形裁切區」把手臂重畫回禮服上方（不用合成模式，Safari 也穩定）
function capsule(a, b, r){
  const t = Math.atan2(b.y-a.y, b.x-a.x), path = new Path2D();
  path.arc(a.x, a.y, r, t+Math.PI/2, t+Math.PI*1.5);
  path.arc(b.x, b.y, r, t-Math.PI/2, t+Math.PI/2);
  path.closePath();
  return path;
}
function drawArms(p, sw){
  const r = sw * 0.16;
  for (const [s,e,w,i] of [["ls","le","lw","li"],["rs","re","rw","ri"]]){
    if (p[e].v < 0.5) continue;
    const segs = [[lerp(p[s], p[e], 0.5), p[e], r]];   // 保留肩上流蘇，從上臂中段開始
    if (p[w].v > 0.4){ segs.push([p[e], p[w], r*0.9]); segs.push([p[w], p[i], r*1.1]); }
    for (const [a,b,rr] of segs){
      const x0 = Math.max(0, Math.min(a.x,b.x)-rr), y0 = Math.max(0, Math.min(a.y,b.y)-rr);
      const x1 = Math.min(out.width, Math.max(a.x,b.x)+rr), y1 = Math.min(out.height, Math.max(a.y,b.y)+rr);
      if (x1 <= x0 || y1 <= y0) continue;
      ctx.save(); ctx.clip(capsule(a, b, rr));
      ctx.drawImage(video, x0, y0, x1-x0, y1-y0, x0, y0, x1-x0, y1-y0);
      ctx.restore();
    }
  }
}

function drawBones(p){
  ctx.fillStyle = "#d8282f"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
  for (const k of ["ls","rs","lh","rh","la","ra","le","re","lw","rw"]){
    if (p[k].v < 0.3) continue;
    ctx.beginPath(); ctx.arc(p[k].x, p[k].y, Math.max(6, out.width/120), 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
}

function loop(){
  if (!running) return;
  try { frame(); }
  catch(err){ console.error(err); ctx.setTransform(1,0,0,1,0,0); $("status").hidden = false; $("status").textContent = "錯誤：" + (err?.message || err); }
  requestAnimationFrame(loop);
}

function frame(){
  if (video.readyState >= 2 && video.videoWidth){
    if (out.width !== video.videoWidth || out.height !== video.videoHeight){
      out.width = video.videoWidth; out.height = video.videoHeight;
      smooth = null;
    }
    const W = out.width, H = out.height;
    const mirror = facing === "user";
    ctx.save();
    if (mirror){ ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, W, H);
    const ts = performance.now();
    if (ts > lastTs){
      lastTs = ts;
      const res = landmarker.detectForVideo(video, ts);
      const lm = res.landmarks?.[0];
      if (lm){
        const p = readPose(lm);
        const ok = p.ls.v > 0.5 && p.rs.v > 0.5;
        if (ok){
          let sw = null;
          if (gl && $("mesh3d").checked){
            try { sw = drawDressMesh(p, ts); }
            catch(err){ console.error(err); $("mesh3d").checked = false; diag = "立體貼合失敗，改用平面"; }
          }
          if (!sw && !(gl && $("mesh3d").checked)) sw = drawDress(p);
          if (sw && $("armFront").checked){
            try { drawArms(p, sw); }
            catch(err){ console.error(err); $("armFront").checked = false; diag = "手臂合成失敗，已關閉"; }
          }
          if ($("bones").checked) drawBones(p);
        }
        $("status").textContent = (ok ? "已對準身體" : "請讓雙肩入鏡") + ($("bones").checked ? `｜${diag}` : "");
        $("status").className = "status" + (ok ? " ok" : "");
      } else {
        smooth = null; phys.P = null;
        $("status").textContent = "找不到人，請站到鏡頭前";
        $("status").className = "status";
      }
    }
    ctx.restore();
  }
}
</script>
